[package]
name = "heavyscope"
version = "0.7.3"
description = "Multi-quota monitor for SuperGrok Heavy and Cursor Ultra"
authors = ["Justin Jia"]
license = "MIT"
repository = "https://github.com/qinlinj/heavyscope"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "heavyscope_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = ["tray-icon", "macos-private-api", "image-png"] }
tauri-plugin-log = "2"
tauri-plugin-opener = "2"
