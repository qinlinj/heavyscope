name: decode-screenshots
on:
  push:
    paths:
      - "docs/images/READY"
permissions:
  contents: write
jobs:
  decode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode PNGs and commit
        run: |
          set -euo pipefail
          for name in dashboard dashboard-zh settings-backup confirm-delete; do
            cat docs/images/parts/${name}.* | tr -d '\n' | base64 -d > "docs/images/${name}.png"
            file "docs/images/${name}.png"
          done
          rm -rf docs/images/parts docs/images/READY docs/images/*.b64
          rm -f .github/workflows/decode-screenshots.yml
          git config user.name "Justin Jia"
          git config user.email "129560356+qinlinj@users.noreply.github.com"
          git add -A docs/images .github/workflows/decode-screenshots.yml
          git commit -m "docs: add product screenshots to README"
          git push
