name: decode-screenshots
on:
  push:
    paths:
      - "docs/images/*.b64"
      - ".github/workflows/decode-screenshots.yml"
permissions:
  contents: write
jobs:
  decode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode PNGs and commit
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(docs/images/*.b64)
          if [ ${#files[@]} -eq 0 ]; then
            echo "no b64 files"
            exit 0
          fi
          for f in "${files[@]}"; do
            out="${f%.b64}"
            base64 -d "$f" > "$out"
            file "$out"
            rm -f "$f"
          done
          rm -f .github/workflows/decode-screenshots.yml
          git config user.name "Justin Jia"
          git config user.email "129560356+qinlinj@users.noreply.github.com"
          git add -A docs/images .github/workflows/decode-screenshots.yml
          git commit -m "docs: add product screenshots to README"
          git push
